name: Feature request
description: An idea for something WARLOGS could track or show
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see, and what would it help you do in the game?
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it would show
      description: Live, Overview, Matches, Insights, Career, or somewhere new.
