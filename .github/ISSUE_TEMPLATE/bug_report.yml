name: Bug report
description: Something is wrong, missing or misread
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: screens
    attributes:
      label: Screenshots
      description: For a misread (gun, reward, map, result), a screenshot of what the game showed helps most.
  - type: input
    id: version
    attributes:
      label: When you last updated
      description: Roughly when you downloaded or last updated WARLOGS.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a match on ...
        2. ...
