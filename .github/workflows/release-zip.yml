# Attaches WARLOGS.zip to every published release. The README's Download link goes to the latest
# release page, and GitHub counts downloads of attached files (not of the source code ZIPs).
name: Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:  # attach the ZIP to a release that already exists
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: git archive --format=zip --prefix=WARLOGS/ -o WARLOGS.zip HEAD
      - run: gh release upload "$TAG" WARLOGS.zip --clobber
