# Runs on every push and pull request to main. A pull request can only merge once all
# three pass (repository ruleset), so a broken fix can't reach players through the updater.
name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # the fix workflow starts this on its branch: PRs it opens don't trigger workflows

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest  # the tracker uses Windows APIs
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .

  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test relay/worker.test.mjs

  ui:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright==1.59.0
      - run: python -m playwright install chromium
      - run: python tests/ui_smoke.py
