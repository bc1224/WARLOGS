# Relay for the dashboard's Report an issue button. Deploy from this folder:
#   npx wrangler deploy
#   npx wrangler secret put GITHUB_TOKEN   (fine-grained token: this repo, Issues read/write only)
name = "wardogs-report-relay"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[kv_namespaces]]
binding = "IMAGES"
id = "068f9975b492468e8967dea7fc18cfc8"

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }
